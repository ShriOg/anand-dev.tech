<html class="dark" lang="en"><head>
<meta charset="utf-8"/>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        
        body {
            background-color: #0f131e;
            overflow: hidden;
        }

        .midnight-gradient {
            background: radial-gradient(circle at 20% 30%, rgba(255, 143, 163, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(201, 191, 255, 0.15) 0%, transparent 50%),
                        #0f131e;
        }

        .star-field {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
        }

        .slow-breath {
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        .light-leak {
            filter: blur(80px);
            background: radial-gradient(circle, rgba(230, 188, 255, 0.1) 0%, transparent 70%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body text-on-surface midnight-gradient min-h-screen relative flex flex-col">
<!-- Atmospheric Layer: Light Leaks & Stars -->
<div class="absolute inset-0 z-0 overflow-hidden">
<div class="light-leak absolute -top-20 -left-20 w-[500px] h-[500px]"></div>
<div class="light-leak absolute -bottom-40 -right-20 w-[600px] h-[600px]"></div>
<!-- Subtle Star Particles (Stateless Simulation) -->
<div class="star-field">
<div class="star w-0.5 h-0.5" style="top: 15%; left: 25%"></div>
<div class="star w-1 h-1" style="top: 45%; left: 10%"></div>
<div class="star w-0.5 h-0.5" style="top: 80%; left: 35%"></div>
<div class="star w-1 h-1" style="top: 20%; left: 75%"></div>
<div class="star w-0.5 h-0.5" style="top: 65%; left: 85%"></div>
<div class="star w-0.5 h-0.5" style="top: 90%; left: 60%"></div>
<div class="star w-1 h-1" style="top: 10%; left: 50%"></div>
</div>
</div>
<!-- Top Bar (Music Toggle Only as requested) -->
<header class="z-50 flex flex-col justify-center px-8 py-6 w-full max-w-lg mx-auto fixed top-0 left-0 right-0">
<div class="flex justify-between items-center w-full">
<div class="text-[#FF8FA3] font-headline italic text-xl tracking-tight opacity-40">
<!-- Branding suppressed for focus -->
</div>
<button class="bg-[#171b27]/40 backdrop-blur-xl p-3 rounded-full text-[#FF8FA3] hover:opacity-80 transition-opacity duration-500 flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="music_note">music_note</span>
</button>
</div>
</header>
<!-- Main Content: Entry Landing -->
<main class="flex-grow flex flex-col items-center justify-center px-8 z-10 text-center relative">
<div class="max-w-xl space-y-12">
<!-- Hero Typography -->
<div class="space-y-6">
<h1 class="font-headline text-4xl md:text-6xl tracking-tight leading-tight text-on-surface">
                    This space exists because <span class="text-primary italic">you</span> do.
                </h1>
<p class="font-body text-lg md:text-xl opacity-60 max-w-md mx-auto leading-relaxed">
                    And because you mean more than you think, Abhilasha.
                </p>
</div>
<!-- CTA Section -->
<div class="flex flex-col items-center pt-8">
<button class="group relative px-12 py-5 bg-gradient-to-r from-primary-container to-secondary rounded-xl text-on-primary font-body font-semibold text-lg tracking-wide shadow-[0_20px_40px_rgba(155,64,83,0.3)] transition-all duration-700 hover:scale-105 active:scale-95">
<span class="relative z-10">Enter</span>
<!-- Soft Glow Aura -->
<div class="absolute inset-0 bg-primary opacity-20 blur-xl rounded-xl group-hover:opacity-40 transition-opacity"></div>
</button>
<!-- Secondary Hint -->
<div class="mt-12 opacity-30 flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="keyboard_double_arrow_down">keyboard_double_arrow_down</span>
<span class="text-[10px] uppercase tracking-[0.3em] font-label">A quiet Sanctuary</span>
</div>
</div>
</div>
<!-- Signature Asymmetric Decorative Element -->
<div class="absolute bottom-[10%] right-[5%] md:right-[15%] w-32 h-32 opacity-20 hidden md:block">
<div class="w-full h-full border-t border-r border-primary-container rounded-tr-[4rem] rotate-12"></div>
</div>
<div class="absolute top-[20%] left-[5%] md:left-[10%] w-24 h-24 opacity-10 hidden md:block">
<div class="w-full h-full border-b border-l border-secondary rounded-bl-[3rem] -rotate-12"></div>
</div>
</main>
<!-- Background Decoration Image (Abstract) -->
<div class="fixed inset-0 -z-10 opacity-30 mix-blend-soft-light pointer-events-none">
<img alt="" class="w-full h-full object-cover" data-alt="Deep blue night sky with soft pink and purple nebula clouds" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAJqh4HqO5cx9hePT_7q0_jq64vSusz9z6_P3kJcOlpx2oWiBsviV0PTP04-9UAVRKCgRttEUdFrL68cYRujYeVXTpyUcrjHAvefSn9hy9YfntcKrn4gXt8OS145BXPyczBtmg6K6F0CoNaPLIqbI6G00-P-MEKT74M8lvSjKnyjvhTEMDqS94A-c1koMP3bLKJP57SrZhjDiNv3-t-9zgzCsacaLXv7njwEUORSmebdiYsK5eGfQXUH5X4vwT6g4vlL8dO7_ML3Vk"/>
</div>
<!-- Navigation Suppressed for Entry Page per "The Filter" Rule -->
<!-- Shell Visibility & Relevance: Navigation suppressed for focus on the Landing Experience -->
</body></html>
