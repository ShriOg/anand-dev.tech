<div class="relative w-full max-w-lg aspect-[3/4] mx-auto">

<svg class="absolute inset-0 w-full h-full pointer-events-none" viewbox="0 0 300 400">

<path class="constellation-line" d="M150 120 L180 90 L210 110 L210 150 L150 220 L90 150 L90 110 L120 90 Z" fill="none" stroke-linejoin="round"></path>

<line class="constellation-line" opacity="0.1" x1="50" x2="90" y1="280" y2="320"></line>
<line class="constellation-line" opacity="0.1" x1="220" x2="260" y1="300" y2="270"></line>
