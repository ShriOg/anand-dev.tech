<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Abhilasha</title>
  <meta name="description" content="A romantic birthday chat surprise for Abhilasha.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="ambient__glow ambient__glow--one"></div>
    <div class="ambient__glow ambient__glow--two"></div>
    <div class="ambient__glow ambient__glow--three"></div>
  </div>

  <div id="floating-hearts" class="floating-hearts" aria-hidden="true"></div>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <main class="experience">
    <section id="intro-screen" class="intro-screen" aria-label="Birthday Intro">
      <div class="intro-screen__content">
        <p class="intro-line" data-line="1">28 March</p>
        <p class="intro-line" data-line="2">A very special day</p>
        <p class="intro-line" data-line="3">Because someone special was born</p>
        <h1 class="intro-line intro-line--name" data-line="4">Abhilasha</h1>
        <button id="open-chat" class="open-chat" type="button">Open your birthday chat</button>
      </div>
    </section>

    <section id="chat-screen" class="chat-screen" aria-label="Birthday Chat">
      <div class="chat-card">
        <header class="chat-header">
          <div class="chat-header__avatar">A</div>
          <div class="chat-header__meta">
            <h2>Abhilasha <span aria-hidden="true">❤</span></h2>
            <p>online</p>
          </div>
        </header>

        <div id="chat-body" class="chat-body" aria-live="polite"></div>
      </div>

      <p id="final-line" class="final-line" aria-live="polite">I'm really glad you exist.</p>
    </section>
  </main>

  <audio id="bgm" preload="auto" loop>
    <source src="assets/bgm.mp3" type="audio/mpeg">
    <source src="assets/music.mp3" type="audio/mpeg">
  </audio>

  <script src="script.js"></script>
</body>
</html>
