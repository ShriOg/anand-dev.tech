<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anand Web OS</title>
    <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <div class="top-bar">
            <div class="top-bar-left">
                <div class="app-name">Anand Web OS</div>
            </div>
            <div class="top-bar-right">
                <span class="user-email" id="userEmail"></span>
                <button class="btn-logout" onclick="logout()">Logout</button>
            </div>
        </div>
        
        <div class="main-container">
            <div class="sidebar">
                <div class="dock-icon active" data-module="notes" onclick="loadModule('notes')" title="Notes">
                    📝
                </div>
                <div class="dock-icon" data-module="files" onclick="loadModule('files')" title="Files">
                    📁
                </div>
                <div class="dock-icon" data-module="ai" onclick="loadModule('ai')" title="AI Assistant">
                    🤖
                </div>
                <div class="dock-icon" data-module="admin" onclick="loadModule('admin')" title="Admin">
                    ⚙️
                </div>
            </div>
            
            <div class="workspace" id="workspace"></div>
        </div>
    </div>
    
    <script src="../js/api.js?v=2"></script>
    <script src="../js/protect.js?v=2"></script>
    <script src="../js/modules/notes.js?v=2"></script>
    <script src="../js/modules/files.js?v=2"></script>
    <script src="../js/modules/ai.js?v=2"></script>
    <script src="../js/modules/admin.js?v=2"></script>
    <script src="../js/dashboard.js?v=2"></script>
</body>
</html>
