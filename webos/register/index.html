<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anand Web OS — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
  <div class="auth-bg"></div>
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Anand <span>Web OS</span></h1>
      <p>Create your account</p>
    </div>
    <div id="authError" class="auth-error"></div>
    <form id="registerForm" class="auth-form" autocomplete="off">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" id="registerBtn">Create Account</button>
    </form>
    <div class="auth-footer">
      Already have an account? <a href="../login/">Sign in</a>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/auth.js?v=2"></script>
</body>
</html>
