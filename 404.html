<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — MenuNova</title>
    <meta name="description" content="Premium 404 experience for MenuNova with quick actions to try demo or return home.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#0b0a12">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-0: #09070f;
            --bg-1: #12101d;
            --bg-2: #1a1527;
            --text: #f8f6ff;
            --text-soft: #c2bed4;
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.16);
            --accent-grad: linear-gradient(120deg, #ffb347 0%, #ff8a3d 45%, #ffd47a 100%);
            --accent-plain: #ff9d46;
            --card-shadow: 0 20px 64px rgba(0, 0, 0, 0.46), 0 0 0 1px rgba(255, 201, 122, 0.14) inset;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            background:
                radial-gradient(900px 480px at -8% -10%, rgba(255, 163, 74, 0.14), transparent 60%),
                radial-gradient(740px 380px at 108% 10%, rgba(185, 132, 255, 0.11), transparent 62%),
                linear-gradient(160deg, var(--bg-0) 0%, var(--bg-1) 52%, var(--bg-2) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        .fog {
            position: absolute;
            inset: -20%;
            pointer-events: none;
            filter: blur(34px);
            opacity: 0.45;
        }

        .fog::before,
        .fog::after {
            content: "";
            position: absolute;
            width: 56vmax;
            height: 56vmax;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 170, 89, 0.16) 0%, rgba(255, 170, 89, 0.08) 26%, transparent 64%);
            animation: steamFloatA 24s ease-in-out infinite alternate;
            transform: translate3d(0, 0, 0);
        }

        .fog::before {
            left: -12vmax;
            top: 8vmax;
        }

        .fog::after {
            right: -16vmax;
            bottom: -8vmax;
            background: radial-gradient(circle at center, rgba(255, 225, 166, 0.12) 0%, rgba(255, 225, 166, 0.06) 30%, transparent 66%);
            animation: steamFloatB 28s ease-in-out infinite alternate;
        }

        .pointer-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            pointer-events: none;
            background: radial-gradient(circle at center, rgba(255, 171, 90, 0.28), rgba(255, 171, 90, 0) 68%);
            filter: blur(26px);
            transform: translate(-50%, -50%);
            opacity: 0;
            transition: opacity 320ms ease;
            z-index: 1;
        }

        .wrap {
            width: min(100%, 760px);
            position: relative;
            z-index: 2;
            animation: cardIn 700ms cubic-bezier(.2, .8, .2, 1) both;
        }

        .card {
            border: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.06));
            border-radius: 28px;
            padding: clamp(26px, 3.5vw, 42px);
            backdrop-filter: blur(18px) saturate(130%);
            -webkit-backdrop-filter: blur(18px) saturate(130%);
            box-shadow: var(--card-shadow);
            transition: transform 420ms cubic-bezier(.2, .8, .2, 1), box-shadow 420ms ease;
            transform-style: preserve-3d;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 30px 76px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 212, 144, 0.18) inset, 0 0 36px rgba(255, 166, 70, 0.22);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 211, 139, 0.45);
            background: rgba(255, 177, 78, 0.08);
            color: #ffe9c7;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .title {
            margin: 18px 0 0;
            font-size: clamp(32px, 5.4vw, 56px);
            line-height: 1.02;
            letter-spacing: -0.03em;
            font-weight: 900;
            text-wrap: balance;
            background: linear-gradient(115deg, #fff9ef 0%, #ffe4b2 38%, #ffbd6f 72%, #fff0d7 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub {
            margin: 16px 0 0;
            max-width: 62ch;
            color: var(--text-soft);
            font-size: clamp(15px, 1.8vw, 18px);
            line-height: 1.7;
            text-wrap: pretty;
        }

        .actions {
            margin-top: 28px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            min-height: 48px;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: .01em;
            transition: transform 240ms ease, box-shadow 280ms ease, border-color 240ms ease, background 280ms ease;
        }

        .btn:hover {
            transform: translateY(-2px) scale(1.03);
        }

        .btn:active {
            transform: translateY(0) scale(0.99);
        }

        .btn-primary {
            background: var(--accent-grad);
            color: #2a1708;
            border-color: rgba(255, 215, 160, 0.82);
            box-shadow: 0 12px 28px rgba(255, 148, 57, 0.36);
        }

        .btn-primary:hover {
            box-shadow: 0 18px 34px rgba(255, 148, 57, 0.42), 0 0 28px rgba(255, 188, 115, 0.3);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #f6f1ff;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .btn-secondary:hover {
            border-color: rgba(255, 194, 121, 0.64);
            background: rgba(255, 255, 255, 0.09);
        }

        @keyframes steamFloatA {
            0% { transform: translate(-3%, 2%) scale(1); }
            50% { transform: translate(2%, -3%) scale(1.03); }
            100% { transform: translate(6%, -7%) scale(1.07); }
        }

        @keyframes steamFloatB {
            0% { transform: translate(2%, 4%) scale(1); }
            50% { transform: translate(-3%, -2%) scale(1.04); }
            100% { transform: translate(-8%, -6%) scale(1.08); }
        }

        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(20px) scale(0.98); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        @media (max-width: 640px) {
            body {
                padding: 14px;
            }

            .card {
                border-radius: 22px;
                padding: 22px 18px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .fog::before,
            .fog::after,
            .wrap,
            .btn,
            .card {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="fog" aria-hidden="true"></div>
    <div class="pointer-glow" id="pointerGlow" aria-hidden="true"></div>

    <main class="wrap" role="main" aria-labelledby="nf-title">
        <section class="card">
            <span class="badge">🍽 MenuNova • ERROR 404</span>
            <h1 class="title" id="nf-title">This page isn’t on the menu.</h1>
            <p class="sub">The link may be outdated or incorrect. But don’t worry — your restaurant operations can still move forward.</p>

            <div class="actions">
                <a class="btn btn-primary" href="/demo">Wanna Try Demo?</a>
                <a class="btn btn-secondary" href="https://menunova.me">Go Home</a>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const glow = document.getElementById('pointerGlow');
            if (!glow || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            let raf = null;
            let targetX = window.innerWidth / 2;
            let targetY = window.innerHeight / 2;
            let x = targetX;
            let y = targetY;

            const tick = () => {
                x += (targetX - x) * 0.08;
                y += (targetY - y) * 0.08;
                glow.style.left = x + 'px';
                glow.style.top = y + 'px';
                raf = requestAnimationFrame(tick);
            };

            window.addEventListener('mousemove', (e) => {
                targetX = e.clientX;
                targetY = e.clientY;
                glow.style.opacity = '0.85';
                if (!raf) raf = requestAnimationFrame(tick);
            });

            window.addEventListener('mouseleave', () => {
                glow.style.opacity = '0';
            });
        })();
    </script>
</body>
</html>
