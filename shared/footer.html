<!-- ============================================
     MenuNova Premium Footer Component
     Can be used on: menunova.me, subdomains, demo
     ============================================
     
     USAGE METHOD 1: Direct HTML Include
     ------------------------------------
     1. Add to <head>:
        <link rel="stylesheet" href="/shared/css/footer.css">
     
     2. Copy this entire <footer> element into your page
     
     
     USAGE METHOD 2: Dynamic Loader (for subdomains)
     ------------------------------------------------
     1. Add to <head>:
        <link rel="stylesheet" href="/shared/css/footer.css">
     
     2. Add mount point in HTML:
        <div id="menunova-footer-mount"></div>
     
     3. Add script before </body>:
        <script src="/shared/js/footer-loader.js"></script>
     
     
     IMPORTANT: All links use absolute URLs for subdomain compatibility
     ============================================ -->

<footer class="menunova-footer">
    <div class="footer-container">
        <!-- Top Section: Grid Layout -->
        <div class="footer-grid">
            <!-- Column 1: Brand -->
            <div class="footer-column footer-brand">
                <h3 class="footer-logo">MenuNova</h3>
                <p class="footer-tagline">Run your restaurant digitally.</p>
                <p class="footer-description">
                    QR menus, real-time orders, and powerful analytics.
                </p>
            </div>

            <!-- Column 2: Product -->
            <div class="footer-column">
                <h4 class="footer-heading">Product</h4>
                <ul class="footer-links">
                    <li><a href="https://menunova.me/features/" class="footer-link">Features</a></li>
                    <li><a href="https://menunova.me/demo" class="footer-link">Demo</a></li>
                    <li><a href="https://menunova.me/pricing/" class="footer-link">Pricing</a></li>
                    <li><a href="https://menunova.me/admin/" class="footer-link">Admin Login</a></li>
                </ul>
            </div>

            <!-- Column 3: Legal -->
            <div class="footer-column">
                <h4 class="footer-heading">Legal</h4>
                <ul class="footer-links">
                    <li><a href="https://menunova.me/privacy-policy/" class="footer-link">Privacy Policy</a></li>
                    <li><a href="https://menunova.me/terms-of-service/" class="footer-link">Terms of Service</a></li>
                </ul>
            </div>

            <!-- Column 4: Contact -->
            <div class="footer-column">
                <h4 class="footer-heading">Contact</h4>
                <ul class="footer-links">
                    <li>
                        <a href="mailto:ceo@menunova.me" class="footer-link footer-email">
                            <svg class="footer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                                <polyline points="22,6 12,13 2,6"></polyline>
                            </svg>
                            ceo@menunova.me
                        </a>
                    </li>
                    <li>
                        <span class="footer-text">
                            <svg class="footer-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                <circle cx="12" cy="10" r="3"></circle>
                            </svg>
                            India
                        </span>
                    </li>
                </ul>
                <!-- Social Links (optional placeholders) -->
                <div class="footer-social">
                    <a href="#" class="footer-social-link" aria-label="Twitter">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M23 3a10.9 10.9 0 01-3.14 1.53 4.48 4.48 0 00-7.86 3v1A10.66 10.66 0 013 4s-4 9 5 13a11.64 11.64 0 01-7 2c9 5 20 0 20-11.5a4.5 4.5 0 00-.08-.83A7.72 7.72 0 0023 3z"></path>
                        </svg>
                    </a>
                    <a href="#" class="footer-social-link" aria-label="LinkedIn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"></path>
                            <circle cx="4" cy="4" r="2"></circle>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- Bottom Strip: Copyright -->
        <div class="footer-bottom">
            <p class="footer-copyright">
                © 2026 MenuNova. All rights reserved.
            </p>
        </div>
    </div>
</footer>
